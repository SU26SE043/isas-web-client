name: React Frontend CI

# Chỉ kích hoạt CI khi có người tạo Pull Request đòi gộp code vào nhánh main
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code từ repo về máy chủ ảo của GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Phiên bản Node.js ổn định nhất hiện tại
          cache: 'npm'

      # 3. Cài đặt các thư viện (như đã khai báo trong package.json)
      - name: Install Dependencies
        run: npm ci

      # 4. Typecheck và unit tests
      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      # 5. Build thử dự án xem có bị lỗi Crash không
      - name: Test Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E Smoke Tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
